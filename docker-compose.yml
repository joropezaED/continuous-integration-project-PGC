version: '3.8'

services:
  # CONTENEDOR 2: Base de Datos
  mongodb:
    image: mongo:6.0
    container_name: mongodb_service
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  # CONTENEDOR 1: Aplicación FastAPI
  api:
    build: ./app
    container_name: fastapi_service
    ports:
      - "8000:8000"
    environment:
      # Se comunica usando el nombre del servicio 'mongodb' definido arriba
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data: